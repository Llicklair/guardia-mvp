[project]
name = "guardia"
version = "0.1.0"
description = "Plano de control para un sistema de seguridad a nivel SO con capa de IA verificada"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
guardia = "guardia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
